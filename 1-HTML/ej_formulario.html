<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
    <h3>Suscríbase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>
        <fieldset>
            <legend>Datos de registro</legend>

            <p>
                Nombre: <input type="text" size="40" maxlength="40" placeholder="Ingrese su nombre">
            </p>

            <p>
                Apellido: <input type="text" size="40" maxlength="40" placeholder="Ingrese su apellido">
            </p>

            <p>
                Sexo:
                <input type="radio" name="sexo" value="masculino"> Masculino
                <input type="radio" name="sexo" value="femenino"> Femenino
            </p>

            <p>
                Edad: <input type="number" maxlength="3" placeholder="Edad">
            </p>

            <p>
                Email: <input type="email" size="40" maxlength="60" placeholder="ejemplo@correo.com">
            </p>

            <p>
                Usuario: <input type="text" size="40" maxlength="20" placeholder="Nombre de usuario">
            </p>

            <p>
                Password: <input type="password" maxlength="20" placeholder="Contraseña">
            </p>

            <p>
                Confirmar Password: <input type="password" maxlength="20" placeholder="Repita la contraseña">
            </p>

            <p>
                Tipo de servicio:
                <select>
                    <option>Free</option>
                    <option>Standard</option>
                    <option>Premium</option>
                </select>
            </p>

            <p>
                Tema:
                <input type="checkbox" name="tema" value="politica"> Política
                <input type="checkbox" name="tema" value="negocios"> Negocios
                <input type="checkbox" name="tema" value="tecnologia"> Tecnología
                <input type="checkbox" name="tema" value="salud"> Salud
            </p>

            <p>
                Agregue un comentario:<br>
                <textarea rows="4" cols="50" placeholder="Escriba su comentario"></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar">
            </p>
        </fieldset>
    </form>
</body>
</html>
