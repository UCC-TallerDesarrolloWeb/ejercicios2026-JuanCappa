
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones Matemáticas</title>
    <link rel="stylesheet" href="miEstilo.css">
    <script src="misFunciones.js" defer></script>
</head>
<body class="body-num">

<div class="centrado div-conver">
    <h1>Operaciones Matemáticas</h1>

    <form class="operacionesMat">
        <p>
            <input id="nums1" type="text"
                   oninput="calcularOperacion('suma')">
            +
            <input id="nums2" type="text"
                   oninput="calcularOperacion('suma')">
            =
            <span id="totalS"></span>
        </p>

        <p>
            <input id="numr1" type="text"
                   oninput="calcularOperacion('resta')">
            -
            <input id="numr2" type="text"
                   oninput="calcularOperacion('resta')">
            =
            <span id="totalR"></span>
        </p>

        <p>
            <input id="numm1" type="text"
                   oninput="calcularOperacion('multiplicacion')">
            ×
            <input id="numm2" type="text"
                   oninput="calcularOperacion('multiplicacion')">
            =
            <span id="totalM"></span>
        </p>

        <p>
            <input id="numd1" type="text"
                   oninput="calcularOperacion('division')">
            /
            <input id="numd2" type="text"
                   oninput="calcularOperacion('division')">
            =
            <span id="totalD"></span>
        </p>
    </form>
</div>

</body>
</html>
